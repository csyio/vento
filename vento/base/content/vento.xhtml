<?xml version="1.0"?>
<?xml-stylesheet href="chrome://global/skin/global.css"?>
<?xml-stylesheet href="chrome://vento/content/vento.css"?>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:xul="http://www.mozilla.org/keymaster/gatekeeper/there.is.only.xul"
      xmlns:svg="http://www.w3.org/2000/svg"
      id="vento-main" windowtype="vento:main" scrolling="false"
      customtitlebar="true" macnativefullscreen="true" macanimationtype="document"
      width="1280" height="820" persist="screenX screenY width height sizemode">
<head>
  <meta charset="utf-8"/>
  <title>Vento</title>
  <script src="chrome://global/content/customElements.js"/>
  <script src="chrome://global/content/globalOverlay.js"/>
  <script src="chrome://vento/content/vento-tabs.js"/>
  <script src="chrome://vento/content/vento-markdown.js"/>
  <script src="chrome://vento/content/vento-ui.js"/>
  <script src="chrome://vento/content/vento-esin.js"/>
  <script src="chrome://vento/content/vento-menu.js"/>
  <script src="chrome://vento/content/vento-find.js"/>
  <script src="chrome://vento/content/vento-downloads.js"/>
  <script src="chrome://vento/content/vento-dialogs.js"/>
  <script src="chrome://vento/content/vento-permissions.js"/>
  <script src="chrome://vento/content/vento-session.js"/>
  <script src="chrome://vento/content/vento-shell.js"/>
</head>
<body>

  <!-- Komutlar ve kısayollar: macOS yerel menüsü bunlardan kurulur. -->
  <xul:commandset id="vento-commands">
    <xul:command id="cmd_newTab"/>
    <xul:command id="cmd_closeTab"/>
    <xul:command id="cmd_print"/>
    <xul:command id="cmd_focusBar"/>
    <xul:command id="cmd_reload"/>
    <xul:command id="cmd_stop"/>
    <xul:command id="cmd_back"/>
    <xul:command id="cmd_forward"/>
    <xul:command id="cmd_nextTab"/>
    <xul:command id="cmd_prevTab"/>
    <xul:command id="cmd_undo"/>
    <xul:command id="cmd_redo"/>
    <xul:command id="cmd_cut"/>
    <xul:command id="cmd_copy"/>
    <xul:command id="cmd_paste"/>
    <xul:command id="cmd_selectAll"/>
    <xul:command id="cmd_find"/>
    <xul:command id="cmd_findNext"/>
    <xul:command id="cmd_findPrev"/>
    <xul:command id="cmd_toggleEsin"/>
    <xul:command id="cmd_quit"/>
  </xul:commandset>

  <xul:keyset id="vento-keys">
    <xul:key id="key_newTab" key="t" modifiers="accel" command="cmd_newTab"/>
    <xul:key id="key_closeTab" key="w" modifiers="accel" command="cmd_closeTab"/>
    <xul:key id="key_print" key="p" modifiers="accel" command="cmd_print"/>
    <xul:key id="key_focusBar" key="l" modifiers="accel" command="cmd_focusBar"/>
    <xul:key id="key_focusBar2" key="k" modifiers="accel" command="cmd_focusBar"/>
    <xul:key id="key_reload" key="r" modifiers="accel" command="cmd_reload"/>
    <xul:key id="key_stop" key="." modifiers="accel" command="cmd_stop"/>
    <xul:key id="key_back" key="[" modifiers="accel" command="cmd_back"/>
    <xul:key id="key_forward" key="]" modifiers="accel" command="cmd_forward"/>
    <xul:key id="key_nextTab" key="]" modifiers="accel,shift" command="cmd_nextTab"/>
    <xul:key id="key_prevTab" key="[" modifiers="accel,shift" command="cmd_prevTab"/>
    <xul:key id="key_undo" key="z" modifiers="accel" command="cmd_undo"/>
    <xul:key id="key_redo" key="z" modifiers="accel,shift" command="cmd_redo"/>
    <xul:key id="key_cut" key="x" modifiers="accel" command="cmd_cut"/>
    <xul:key id="key_copy" key="c" modifiers="accel" command="cmd_copy"/>
    <xul:key id="key_paste" key="v" modifiers="accel" command="cmd_paste"/>
    <xul:key id="key_selectAll" key="a" modifiers="accel" command="cmd_selectAll"/>
    <xul:key id="key_find" key="f" modifiers="accel" command="cmd_find"/>
    <xul:key id="key_findNext" key="g" modifiers="accel" command="cmd_findNext"/>
    <xul:key id="key_findPrev" key="g" modifiers="accel,shift" command="cmd_findPrev"/>
    <xul:key id="key_toggleEsin" key="e" modifiers="accel" command="cmd_toggleEsin"/>
    <xul:key id="key_quit" key="q" modifiers="accel" command="cmd_quit"/>
  </xul:keyset>

  <!-- Sayfa sağ tık menüsü: içeriği vento-menu.js dinamik kurar. -->
  <xul:popupset>
    <xul:menupopup id="page-context-menu"/>
  </xul:popupset>

  <!-- Yerel menü kaynağı (ekranda görünmez). -->
  <div id="vento-menus">
    <xul:toolbox>
      <xul:toolbar type="menubar" id="toolbar-menubar">
        <xul:menubar id="main-menubar">
          <xul:menu id="file-menu" label="Dosya">
            <xul:menupopup id="menu_FilePopup">
              <xul:menuitem id="menu_newTab" label="Yeni Sekme" command="cmd_newTab" key="key_newTab"/>
              <xul:menuitem id="menu_closeTab" label="Sekmeyi Kapat" command="cmd_closeTab" key="key_closeTab"/>
              <xul:menuseparator/>
              <xul:menuitem id="menu_print" label="Yazdır…" command="cmd_print" key="key_print"/>
              <xul:menuseparator/>
              <xul:menuitem id="menu_FileQuitItem" label="Vento'dan Çık" command="cmd_quit" key="key_quit"/>
            </xul:menupopup>
          </xul:menu>
          <xul:menu id="edit-menu" label="Düzen">
            <xul:menupopup id="menu_EditPopup">
              <xul:menuitem id="menu_undo" label="Geri Al" command="cmd_undo" key="key_undo"/>
              <xul:menuitem id="menu_redo" label="Yinele" command="cmd_redo" key="key_redo"/>
              <xul:menuseparator/>
              <xul:menuitem id="menu_cut" label="Kes" command="cmd_cut" key="key_cut"/>
              <xul:menuitem id="menu_copy" label="Kopyala" command="cmd_copy" key="key_copy"/>
              <xul:menuitem id="menu_paste" label="Yapıştır" command="cmd_paste" key="key_paste"/>
              <xul:menuitem id="menu_selectAll" label="Tümünü Seç" command="cmd_selectAll" key="key_selectAll"/>
              <xul:menuseparator/>
              <xul:menuitem id="menu_find" label="Sayfada Ara…" command="cmd_find" key="key_find"/>
              <xul:menuitem id="menu_findNext" label="Sonrakini Bul" command="cmd_findNext" key="key_findNext"/>
              <xul:menuitem id="menu_findPrev" label="Öncekini Bul" command="cmd_findPrev" key="key_findPrev"/>
            </xul:menupopup>
          </xul:menu>
          <xul:menu id="view-menu" label="Görünüm">
            <xul:menupopup id="menu_ViewPopup">
              <xul:menuitem id="menu_focusBar" label="Akıllı Çubuğa Git" command="cmd_focusBar" key="key_focusBar"/>
              <xul:menuitem id="menu_toggleEsin" label="Esin'i Aç/Kapat" command="cmd_toggleEsin" key="key_toggleEsin"/>
              <xul:menuitem id="menu_reload" label="Sayfayı Yenile" command="cmd_reload" key="key_reload"/>
              <xul:menuitem id="menu_stop" label="Yüklemeyi Durdur" command="cmd_stop" key="key_stop"/>
            </xul:menupopup>
          </xul:menu>
          <xul:menu id="history-menu" label="Geçmiş">
            <xul:menupopup id="menu_HistoryPopup">
              <xul:menuitem id="menu_back" label="Geri" command="cmd_back" key="key_back"/>
              <xul:menuitem id="menu_forward" label="İleri" command="cmd_forward" key="key_forward"/>
              <xul:menuseparator/>
              <xul:menuitem id="menu_nextTab" label="Sonraki Sekme" command="cmd_nextTab" key="key_nextTab"/>
              <xul:menuitem id="menu_prevTab" label="Önceki Sekme" command="cmd_prevTab" key="key_prevTab"/>
            </xul:menupopup>
          </xul:menu>
        </xul:menubar>
      </xul:toolbar>
    </xul:toolbox>
  </div>

  <!-- Sekme şeridi -->
  <div id="tabstrip">
    <!-- macOS trafik ışıkları bu kutunun içine yerleştirilir (boş kutu; boyutunu tema verir). -->
    <div class="titlebar-buttonbox"></div>
    <div id="tabs"></div>
    <button id="newtab" title="Yeni sekme (⌘T)">
      <svg:svg viewBox="0 0 16 16"><svg:path d="M8 3.5v9M3.5 8h9"/></svg:svg>
    </button>
  </div>

  <!-- Araç çubuğu: gezinme + akıllı çubuk -->
  <div id="toolbar">
    <button id="nav-back" class="nav" title="Geri (⌘[)" disabled="true">
      <svg:svg viewBox="0 0 16 16"><svg:path d="M10 3.5 5.5 8l4.5 4.5"/></svg:svg>
    </button>
    <button id="nav-forward" class="nav" title="İleri (⌘])" disabled="true">
      <svg:svg viewBox="0 0 16 16"><svg:path d="M6 3.5 10.5 8 6 12.5"/></svg:svg>
    </button>
    <button id="nav-reload" class="nav" title="Yenile (⌘R)">
      <svg:svg viewBox="0 0 16 16"><svg:path d="M13 8a5 5 0 1 1-1.6-3.7M13 2.8v2.6h-2.6"/></svg:svg>
    </button>
    <div id="smartbar-slot">
      <div id="smartbar">
        <svg:svg id="smartbar-icon" viewBox="0 0 16 16"><svg:circle cx="7" cy="7" r="4.2"/><svg:path d="M10.2 10.2 13 13"/></svg:svg>
        <input id="smartbar-input" type="text" spellcheck="false" autocomplete="off"
               placeholder="Adres yaz, ara ya da Esin'e sor"/>
      </div>
      <div id="smartbar-suggest" hidden="true">
        <button class="suggest-row" data-kind="esin">
          <svg:svg viewBox="0 0 16 16"><svg:path d="M8 2.2l1.4 3.6 3.6 1.4-3.6 1.4L8 12.2 6.6 8.6 3 7.2l3.6-1.4z"/></svg:svg>
          <span class="suggest-label">Esin'e sor</span><span class="suggest-text"></span>
        </button>
        <button class="suggest-row" data-kind="search">
          <svg:svg viewBox="0 0 16 16"><svg:circle cx="7" cy="7" r="4.2"/><svg:path d="M10.2 10.2 13 13"/></svg:svg>
          <span class="suggest-label">Ara</span><span class="suggest-text"></span>
        </button>
      </div>
    </div>
    <button id="nav-downloads" class="nav" title="İndirilenler" hidden="true">
      <svg:svg viewBox="0 0 16 16"><svg:path d="M8 3v7M5 7.5l3 3 3-3M3.5 13h9"/></svg:svg>
    </button>
    <button id="nav-esin" class="nav" title="Esin (⌘E)">
      <svg:svg viewBox="0 0 16 16"><svg:path d="M8 2.2l1.4 3.6 3.6 1.4-3.6 1.4L8 12.2 6.6 8.6 3 7.2l3.6-1.4z"/><svg:path d="M12.6 10.6l.5 1.2 1.2.5-1.2.5-.5 1.2-.5-1.2-1.2-.5 1.2-.5z"/></svg:svg>
    </button>
  </div>

  <!-- Çalışma alanı: sayfa kartı + Esin paneli -->
  <div id="workspace">
    <div id="stage">
      <div id="gust"></div>
      <div id="findbar" hidden="true">
        <svg:svg id="find-icon" viewBox="0 0 16 16"><svg:circle cx="7" cy="7" r="4.2"/><svg:path d="M10.2 10.2 13 13"/></svg:svg>
        <input id="find-input" type="text" spellcheck="false" autocomplete="off" placeholder="Sayfada ara"/>
        <span id="find-count"></span>
        <button id="find-prev" class="find-btn" title="Önceki (⇧⌘G)"><svg:svg viewBox="0 0 16 16"><svg:path d="M4 10l4-4 4 4"/></svg:svg></button>
        <button id="find-next" class="find-btn" title="Sonraki (⌘G)"><svg:svg viewBox="0 0 16 16"><svg:path d="M4 6l4 4 4-4"/></svg:svg></button>
        <button id="find-close" class="find-btn" title="Kapat (esc)"><svg:svg viewBox="0 0 16 16"><svg:path d="M4 4l8 8M12 4l-8 8"/></svg:svg></button>
      </div>
      <div id="start">
        <div id="start-word">Vento</div>
        <div id="start-hint"><kbd>⌘L</kbd> ile yaz, <kbd>↵</kbd> ile git</div>
      </div>
      <div id="browsers"></div>
      <div id="perm-layer" hidden="true"></div>
      <div id="dialog-layer" hidden="true"></div>
    </div>

    <div id="downloads-panel" hidden="true">
      <div id="dl-head"><span>İndirilenler</span><button id="dl-clear">Temizle</button></div>
      <div id="dl-rows"></div>
      <div id="dl-empty">Henüz indirme yok</div>
    </div>

    <aside id="esin" hidden="true">
      <header id="esin-head">
        <span class="esin-title">
          <svg:svg viewBox="0 0 16 16"><svg:path d="M8 2.2l1.4 3.6 3.6 1.4-3.6 1.4L8 12.2 6.6 8.6 3 7.2l3.6-1.4z"/></svg:svg>
          Esin
        </span>
        <button id="esin-clear" class="esin-icon" title="Yeni sohbet">
          <svg:svg viewBox="0 0 16 16"><svg:path d="M3 8a5 5 0 1 1 1.6 3.7M3 13.2v-2.6h2.6"/></svg:svg>
        </button>
        <button id="esin-close" class="esin-icon" title="Kapat (esc)">
          <svg:svg viewBox="0 0 16 16"><svg:path d="M4 4l8 8M12 4l-8 8"/></svg:svg>
        </button>
      </header>

      <div id="esin-thread">
        <div id="esin-consent" hidden="true">
          <strong>Esin nasıl çalışır</strong>
          <p>Sorduğun soru ve bağlama eklediğin sayfaların metni, yanıt üretmek için LLMTR üzerinden
             GreenPT'ye (Fransa) gönderilir. Girdilerin model eğitiminde kullanılmaz. Sayfa metni
             yalnızca sen bir soru gönderdiğinde ve o sekme bağlamdayken gönderilir; neyin gittiğini her
             mesajın altında görürsün.</p>
          <button id="esin-consent-ok">Anladım</button>
        </div>
        <div id="esin-empty">
          <div class="empty-title">Bu sayfayı sor</div>
          <button data-q="Bu sayfayı kısaca özetle.">Özetle</button>
          <button data-q="Bu sayfanın ana noktalarını madde madde çıkar.">Ana noktalar</button>
          <button data-q="Bunu basit bir dille, sanki ilk kez duyuyormuşum gibi anlat.">Basitçe anlat</button>
        </div>
      </div>

      <div id="esin-context">
        <div id="esin-chips"></div>
        <button id="esin-add" title="Başka bir sekmeyi bağlama ekle">+ Sekme</button>
        <div id="esin-menu" hidden="true"></div>
      </div>

      <form id="esin-form">
        <textarea id="esin-input" rows="1" spellcheck="true" placeholder="Esin'e sor…"></textarea>
        <button id="esin-send" type="submit" title="Gönder (↵)">
          <svg:svg class="ic-send" viewBox="0 0 16 16"><svg:path d="M8 13V3.5M4 7l4-4 4 4"/></svg:svg>
          <svg:svg class="ic-stop" viewBox="0 0 16 16"><svg:rect x="4.5" y="4.5" width="7" height="7" rx="1.5"/></svg:svg>
        </button>
      </form>
    </aside>
  </div>

</body>
</html>
