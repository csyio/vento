<?xml version="1.0"?>
<?xml-stylesheet href="chrome://global/skin/global.css"?>
<?xml-stylesheet href="chrome://vento/content/vento.css"?>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:xul="http://www.mozilla.org/keymaster/gatekeeper/there.is.only.xul"
      xmlns:svg="http://www.w3.org/2000/svg"
      id="vento-main" windowtype="vento:main" scrolling="false"
      customtitlebar="true" macnativefullscreen="true" macanimationtype="document"
      width="1280" height="820" persist="screenX screenY width height sizemode">
<head>
  <meta charset="utf-8"/>
  <title>Vento</title>
  <link rel="localization" href="vento/vento.ftl"/>
  <script src="chrome://global/content/customElements.js"/>
  <script src="chrome://global/content/globalOverlay.js"/>
  <script src="chrome://vento/content/vento-l10n.js"/>
  <script src="chrome://vento/content/vento-tabs.js"/>
  <script src="chrome://vento/content/vento-motion.js"/>
  <script src="chrome://vento/content/vento-markdown.js"/>
  <script src="chrome://vento/content/vento-ui.js"/>
  <script src="chrome://vento/content/vento-esin.js"/>
  <script src="chrome://vento/content/vento-menu.js"/>
  <script src="chrome://vento/content/vento-find.js"/>
  <script src="chrome://vento/content/vento-downloads.js"/>
  <script src="chrome://vento/content/vento-dialogs.js"/>
  <script src="chrome://vento/content/vento-permissions.js"/>
  <script src="chrome://vento/content/vento-session.js"/>
  <script src="chrome://vento/content/vento-start.js"/>
  <script src="chrome://vento/content/vento-bookmarks.js"/>
  <script src="chrome://vento/content/vento-update.js"/>
  <script src="chrome://vento/content/vento-welcome.js"/>
  <script src="chrome://vento/content/vento-shell.js"/>
</head>
<body>

  <!-- Commands and shortcuts: the macOS native menu is built from these. -->
  <xul:commandset id="vento-commands">
    <xul:command id="cmd_newTab"/>
    <xul:command id="cmd_closeTab"/>
    <xul:command id="cmd_print"/>
    <xul:command id="cmd_bookmark"/>
    <xul:command id="cmd_reopenTab" disabled="true"/>
    <xul:command id="cmd_focusBar"/>
    <xul:command id="cmd_reload"/>
    <xul:command id="cmd_stop"/>
    <xul:command id="cmd_back"/>
    <xul:command id="cmd_forward"/>
    <xul:command id="cmd_nextTab"/>
    <xul:command id="cmd_prevTab"/>
    <xul:command id="cmd_undo"/>
    <xul:command id="cmd_redo"/>
    <xul:command id="cmd_cut"/>
    <xul:command id="cmd_copy"/>
    <xul:command id="cmd_paste"/>
    <xul:command id="cmd_selectAll"/>
    <xul:command id="cmd_find"/>
    <xul:command id="cmd_findNext"/>
    <xul:command id="cmd_findPrev"/>
    <xul:command id="cmd_toggleEsin"/>
    <xul:command id="cmd_quit"/>
  </xul:commandset>

  <xul:keyset id="vento-keys">
    <xul:key id="key_newTab" key="t" modifiers="accel" command="cmd_newTab"/>
    <xul:key id="key_closeTab" key="w" modifiers="accel" command="cmd_closeTab"/>
    <xul:key id="key_print" key="p" modifiers="accel" command="cmd_print"/>
    <xul:key id="key_bookmark" key="d" modifiers="accel" command="cmd_bookmark"/>
    <xul:key id="key_reopenTab" key="t" modifiers="accel,shift" command="cmd_reopenTab"/>
    <xul:key id="key_focusBar" key="l" modifiers="accel" command="cmd_focusBar"/>
    <xul:key id="key_focusBar2" key="k" modifiers="accel" command="cmd_focusBar"/>
    <xul:key id="key_reload" key="r" modifiers="accel" command="cmd_reload"/>
    <xul:key id="key_stop" key="." modifiers="accel" command="cmd_stop"/>
    <xul:key id="key_back" key="[" modifiers="accel" command="cmd_back"/>
    <xul:key id="key_forward" key="]" modifiers="accel" command="cmd_forward"/>
    <xul:key id="key_nextTab" key="]" modifiers="accel,shift" command="cmd_nextTab"/>
    <xul:key id="key_prevTab" key="[" modifiers="accel,shift" command="cmd_prevTab"/>
    <xul:key id="key_undo" key="z" modifiers="accel" command="cmd_undo"/>
    <xul:key id="key_redo" key="z" modifiers="accel,shift" command="cmd_redo"/>
    <xul:key id="key_cut" key="x" modifiers="accel" command="cmd_cut"/>
    <xul:key id="key_copy" key="c" modifiers="accel" command="cmd_copy"/>
    <xul:key id="key_paste" key="v" modifiers="accel" command="cmd_paste"/>
    <xul:key id="key_selectAll" key="a" modifiers="accel" command="cmd_selectAll"/>
    <xul:key id="key_find" key="f" modifiers="accel" command="cmd_find"/>
    <xul:key id="key_findNext" key="g" modifiers="accel" command="cmd_findNext"/>
    <xul:key id="key_findPrev" key="g" modifiers="accel,shift" command="cmd_findPrev"/>
    <xul:key id="key_toggleEsin" key="e" modifiers="accel" command="cmd_toggleEsin"/>
    <xul:key id="key_quit" key="q" modifiers="accel" command="cmd_quit"/>
  </xul:keyset>

  <!-- Page context menu: vento-menu.js builds its contents dynamically. -->
  <xul:popupset>
    <xul:menupopup id="page-context-menu"/>
  </xul:popupset>

  <!-- Native menu source (not visible on screen). -->
  <div id="vento-menus">
    <xul:toolbox>
      <xul:toolbar type="menubar" id="toolbar-menubar">
        <xul:menubar id="main-menubar">
          <xul:menu id="file-menu" data-l10n-id="menu-file">
            <xul:menupopup id="menu_FilePopup">
              <xul:menuitem id="menu_newTab" data-l10n-id="menu-new-tab" command="cmd_newTab" key="key_newTab"/>
              <xul:menuitem id="menu_closeTab" data-l10n-id="menu-close-tab" command="cmd_closeTab" key="key_closeTab"/>
              <xul:menuseparator/>
              <xul:menuitem id="menu_print" data-l10n-id="menu-print" command="cmd_print" key="key_print"/>
              <xul:menuseparator/>
              <xul:menuitem id="menu_FileQuitItem" data-l10n-id="menu-quit" command="cmd_quit" key="key_quit"/>
            </xul:menupopup>
          </xul:menu>
          <xul:menu id="edit-menu" data-l10n-id="menu-edit">
            <xul:menupopup id="menu_EditPopup">
              <xul:menuitem id="menu_undo" data-l10n-id="menu-undo" command="cmd_undo" key="key_undo"/>
              <xul:menuitem id="menu_redo" data-l10n-id="menu-redo" command="cmd_redo" key="key_redo"/>
              <xul:menuseparator/>
              <xul:menuitem id="menu_cut" data-l10n-id="menu-cut" command="cmd_cut" key="key_cut"/>
              <xul:menuitem id="menu_copy" data-l10n-id="menu-copy" command="cmd_copy" key="key_copy"/>
              <xul:menuitem id="menu_paste" data-l10n-id="menu-paste" command="cmd_paste" key="key_paste"/>
              <xul:menuitem id="menu_selectAll" data-l10n-id="menu-select-all" command="cmd_selectAll" key="key_selectAll"/>
              <xul:menuseparator/>
              <xul:menuitem id="menu_find" data-l10n-id="menu-find" command="cmd_find" key="key_find"/>
              <xul:menuitem id="menu_findNext" data-l10n-id="menu-find-next" command="cmd_findNext" key="key_findNext"/>
              <xul:menuitem id="menu_findPrev" data-l10n-id="menu-find-prev" command="cmd_findPrev" key="key_findPrev"/>
            </xul:menupopup>
          </xul:menu>
          <xul:menu id="view-menu" data-l10n-id="menu-view">
            <xul:menupopup id="menu_ViewPopup">
              <xul:menuitem id="menu_focusBar" data-l10n-id="menu-focus-bar" command="cmd_focusBar" key="key_focusBar"/>
              <xul:menuitem id="menu_toggleEsin" data-l10n-id="menu-toggle-esin" command="cmd_toggleEsin" key="key_toggleEsin"/>
              <xul:menuitem id="menu_reload" data-l10n-id="menu-reload" command="cmd_reload" key="key_reload"/>
              <xul:menuitem id="menu_stop" data-l10n-id="menu-stop" command="cmd_stop" key="key_stop"/>
            </xul:menupopup>
          </xul:menu>
          <xul:menu id="history-menu" data-l10n-id="menu-history">
            <xul:menupopup id="menu_HistoryPopup">
              <xul:menuitem id="menu_back" data-l10n-id="menu-back" command="cmd_back" key="key_back"/>
              <xul:menuitem id="menu_forward" data-l10n-id="menu-forward" command="cmd_forward" key="key_forward"/>
              <xul:menuseparator/>
              <xul:menuitem id="menu_reopenTab" data-l10n-id="menu-reopen-tab" command="cmd_reopenTab" key="key_reopenTab"/>
              <xul:menuseparator/>
              <xul:menuitem id="menu_nextTab" data-l10n-id="menu-next-tab" command="cmd_nextTab" key="key_nextTab"/>
              <xul:menuitem id="menu_prevTab" data-l10n-id="menu-prev-tab" command="cmd_prevTab" key="key_prevTab"/>
            </xul:menupopup>
          </xul:menu>
          <xul:menu id="bookmarks-menu" data-l10n-id="menu-bookmarks">
            <xul:menupopup id="menu_BookmarksPopup">
              <xul:menuitem id="menu_bookmarkThis" data-l10n-id="menu-bookmark-this" command="cmd_bookmark" key="key_bookmark"/>
              <xul:menuseparator/>
            </xul:menupopup>
          </xul:menu>
        </xul:menubar>
      </xul:toolbar>
    </xul:toolbox>
  </div>

  <!-- Tab strip -->
  <div id="tabstrip">
    <!-- The macOS traffic lights are placed inside this box (empty box; the theme sets its size). -->
    <div class="titlebar-buttonbox"></div>
    <div id="tabs"></div>
    <button id="newtab" data-l10n-id="tip-new-tab">
      <svg:svg viewBox="0 0 16 16"><svg:path d="M8 3.5v9M3.5 8h9"/></svg:svg>
    </button>
  </div>

  <!-- Toolbar: navigation + smart bar -->
  <div id="toolbar">
    <button id="nav-back" class="nav" data-l10n-id="tip-back" disabled="true">
      <svg:svg viewBox="0 0 16 16"><svg:path d="M10 3.5 5.5 8l4.5 4.5"/></svg:svg>
    </button>
    <button id="nav-forward" class="nav" data-l10n-id="tip-forward" disabled="true">
      <svg:svg viewBox="0 0 16 16"><svg:path d="M6 3.5 10.5 8 6 12.5"/></svg:svg>
    </button>
    <button id="nav-reload" class="nav" data-l10n-id="tip-reload">
      <svg:svg viewBox="0 0 16 16"><svg:path d="M13 8a5 5 0 1 1-1.6-3.7M13 2.8v2.6h-2.6"/></svg:svg>
    </button>
    <div id="smartbar-slot">
      <div id="smartbar">
        <svg:svg id="smartbar-icon" viewBox="0 0 16 16"><svg:circle cx="7" cy="7" r="4.2"/><svg:path d="M10.2 10.2 13 13"/></svg:svg>
        <input id="smartbar-input" type="text" spellcheck="false" autocomplete="off"
               data-l10n-id="smartbar-placeholder"/>
      </div>
      <div id="smartbar-suggest" hidden="true">
        <button class="suggest-row" data-kind="esin">
          <svg:svg viewBox="0 0 16 16"><svg:path d="M8 2.2l1.4 3.6 3.6 1.4-3.6 1.4L8 12.2 6.6 8.6 3 7.2l3.6-1.4z"/></svg:svg>
          <span class="suggest-label" data-l10n-id="suggest-ask-esin"></span><span class="suggest-text"></span>
        </button>
        <button class="suggest-row" data-kind="search">
          <svg:svg viewBox="0 0 16 16"><svg:circle cx="7" cy="7" r="4.2"/><svg:path d="M10.2 10.2 13 13"/></svg:svg>
          <span class="suggest-label" data-l10n-id="suggest-search"></span><span class="suggest-text"></span>
        </button>
      </div>
    </div>
    <button id="nav-bookmark" class="nav" data-l10n-id="tip-bookmark" disabled="true">
      <svg:svg viewBox="0 0 16 16"><svg:path d="M8 2.2l1.7 3.6 3.9.5-2.9 2.7.8 3.9L8 10.9l-3.5 2 .8-3.9L2.4 6.3l3.9-.5z"/></svg:svg>
    </button>
    <button id="nav-downloads" class="nav" data-l10n-id="tip-downloads" hidden="true">
      <svg:svg viewBox="0 0 16 16"><svg:path d="M8 3v7M5 7.5l3 3 3-3M3.5 13h9"/></svg:svg>
    </button>
    <button id="nav-esin" class="nav" data-l10n-id="tip-esin">
      <span class="esin-glyph" aria-hidden="true"></span>
    </button>
  </div>

  <!-- Workspace: page card + Esin panel -->
  <div id="workspace">
    <div id="stage">
      <div id="gust"></div>
      <div id="findbar" hidden="true">
        <svg:svg id="find-icon" viewBox="0 0 16 16"><svg:circle cx="7" cy="7" r="4.2"/><svg:path d="M10.2 10.2 13 13"/></svg:svg>
        <input id="find-input" type="text" spellcheck="false" autocomplete="off" data-l10n-id="find-placeholder"/>
        <span id="find-count"></span>
        <button id="find-prev" class="find-btn" data-l10n-id="find-prev"><svg:svg viewBox="0 0 16 16"><svg:path d="M4 10l4-4 4 4"/></svg:svg></button>
        <button id="find-next" class="find-btn" data-l10n-id="find-next"><svg:svg viewBox="0 0 16 16"><svg:path d="M4 6l4 4 4-4"/></svg:svg></button>
        <button id="find-close" class="find-btn" data-l10n-id="find-close"><svg:svg viewBox="0 0 16 16"><svg:path d="M4 4l8 8M12 4l-8 8"/></svg:svg></button>
      </div>
      <div id="start">
        <div id="start-wall" aria-hidden="true"></div>
        <!-- Ebabil (mascot): four layers stacked with additive blending; wings/tail rotate separately (tools/make-ebabil.py) -->
        <div id="ebabil" aria-hidden="true">
          <div id="ebabil-glow"></div>
          <svg id="ebabil-wind" viewBox="0 0 320 240" preserveAspectRatio="none">
            <defs>
              <linearGradient id="eb-wind-grad" x1="0" x2="1"><stop offset="0" stop-color="#40a0f0" stop-opacity="0"/><stop offset="0.5" stop-color="#3ccfe8" stop-opacity="0.9"/><stop offset="1" stop-color="#20e0d0" stop-opacity="0"/></linearGradient>
            </defs>
            <path class="eb-streak s1" d="M-20 150 C 60 130, 120 168, 190 146 S 290 140, 340 150" />
            <path class="eb-streak s2" d="M-20 188 C 50 176, 120 204, 200 186 S 300 184, 340 192" />
            <path class="eb-streak s3" d="M-20 108 C 70 96, 130 124, 200 104 S 290 100, 340 110" />
          </svg>
          <div id="ebabil-rig">
            <img class="eb eb-wr" src="chrome://vento/content/ebabil/wing-r.webp" alt=""/>
            <img class="eb eb-body" src="chrome://vento/content/ebabil/body.webp" alt=""/>
            <img class="eb eb-tail" src="chrome://vento/content/ebabil/tail.webp" alt=""/>
            <img class="eb eb-wl" src="chrome://vento/content/ebabil/wing-l.webp" alt=""/>
          </div>
        </div>
        <div id="start-word">Vento</div>
        <div id="start-hint" data-l10n-id="start-hint"><kbd></kbd><kbd></kbd></div>
        <div id="start-sites" hidden="true"></div>
        <button id="start-custom" data-l10n-id="start-custom">
          <svg:svg viewBox="0 0 16 16"><svg:path d="M2.5 5h7M12.5 5h1M2.5 11h1M6.5 11h7"/><svg:circle cx="11" cy="5" r="1.6"/><svg:circle cx="5" cy="11" r="1.6"/></svg:svg>
          <span data-l10n-id="start-custom-label"></span>
        </button>
      </div>
      <div id="browsers"></div>
      <div id="custom-panel" hidden="true" role="dialog" aria-labelledby="cp-head">
        <div class="cp-head" id="cp-head" data-l10n-id="cp-head"></div>
        <div class="cp-label" data-l10n-id="cp-wallpaper"></div>
        <div id="cp-walls"></div>
        <label class="cp-row"><span data-l10n-id="cp-ebabil"></span><input id="cp-ebabil" type="checkbox"/></label>
        <label class="cp-row"><span data-l10n-id="cp-search"></span>
          <select id="cp-search">
            <option value="duckduckgo">DuckDuckGo</option>
            <option value="google">Google</option>
          </select>
        </label>
        <p id="cp-search-note" data-l10n-id="cp-search-note" hidden="true"></p>
        <label class="cp-row"><span data-l10n-id="cp-sites"></span><input id="cp-sites" type="checkbox"/></label>
        <label class="cp-row"><span data-l10n-id="cp-esin"></span><input id="cp-esin" type="checkbox"/></label>
        <label class="cp-row"><span data-l10n-id="cp-model"></span>
          <select id="cp-model">
            <option value="" data-l10n-id="cp-model-default"></option>
            <option value="qwen/qwen3.6-35b-a3b">Qwen 3.6 (35B)</option>
            <option value="qwen/qwen3.6-flash">Qwen 3.6 Flash</option>
          </select>
        </label>
        <p id="cp-model-note" data-l10n-id="cp-model-note" hidden="true"></p>
        <label class="cp-row"><span data-l10n-id="cp-update-auto"></span><input id="cp-update-auto" type="checkbox"/></label>
        <div class="cp-row cp-update"><button id="cp-update-check" data-l10n-id="cp-update-check"></button><span id="cp-update-status" role="status"></span></div>
      </div>
      <div id="update-bar" hidden="true" role="status">
        <span id="ub-text"></span>
        <button id="ub-primary"></button>
        <button id="ub-later" data-l10n-id="ub-later"></button>
      </div>
      <div id="perm-layer" hidden="true"></div>
      <div id="dialog-layer" hidden="true"></div>
    </div>

    <div id="downloads-panel" hidden="true">
      <div id="dl-head"><span data-l10n-id="dl-title"></span><button id="dl-clear" data-l10n-id="dl-clear"></button></div>
      <div id="dl-rows"></div>
      <div id="dl-empty">
        <img class="empty-ebabil" src="chrome://vento/content/art/pose-empty.webp" alt="" aria-hidden="true"/>
        <div data-l10n-id="dl-empty"></div>
      </div>
    </div>

    <aside id="esin" hidden="true">
      <header id="esin-head">
        <span class="esin-title">
          <img class="esin-logo" src="chrome://vento/content/esin/esin-color.png" alt="" aria-hidden="true"/>
          Esin
        </span>
        <button id="esin-clear" class="esin-icon" data-l10n-id="esin-new-chat">
          <svg:svg viewBox="0 0 16 16"><svg:path d="M3 8a5 5 0 1 1 1.6 3.7M3 13.2v-2.6h2.6"/></svg:svg>
        </button>
        <button id="esin-close" class="esin-icon" data-l10n-id="esin-close">
          <svg:svg viewBox="0 0 16 16"><svg:path d="M4 4l8 8M12 4l-8 8"/></svg:svg>
        </button>
      </header>

      <div id="esin-thread">
        <div id="esin-consent" hidden="true">
          <strong data-l10n-id="esin-consent-title"></strong>
          <p data-l10n-id="esin-consent-body"></p>
          <button id="esin-consent-ok" data-l10n-id="esin-consent-ok"></button>
        </div>
        <div id="esin-empty">
          <img class="empty-ebabil" src="chrome://vento/content/art/pose-empty.webp" alt="" aria-hidden="true"/>
          <div class="empty-title" data-l10n-id="esin-empty-title"></div>
          <button data-q-id="esin-q-summarize" data-l10n-id="esin-q-summarize-label"></button>
          <button data-q-id="esin-q-keypoints" data-l10n-id="esin-q-keypoints-label"></button>
          <button data-q-id="esin-q-simple" data-l10n-id="esin-q-simple-label"></button>
          <div id="esin-thanks">
            <!-- LLMTR official logo: DO NOT MODIFY; the brand's own card color and padding of at least 50% of the logo height around it (same as site/src/parts.mjs) -->
            <div id="esin-llmtr" role="link" tabindex="0" data-l10n-id="esin-llmtr-open">
              <picture>
                <source media="(prefers-color-scheme: dark)" srcset="chrome://vento/content/esin/llmtr-on-dark.svg"/>
                <img src="chrome://vento/content/esin/llmtr-on-light.svg" alt="LLMTR" width="112" height="28.5"/>
              </picture>
            </div>
            <p data-l10n-id="esin-thanks"></p>
          </div>
        </div>
      </div>

      <div id="esin-context">
        <div id="esin-chips"></div>
        <button id="esin-add" data-l10n-id="esin-add-tab"></button>
        <div id="esin-menu" hidden="true"></div>
      </div>

      <form id="esin-form">
        <textarea id="esin-input" rows="1" spellcheck="true" data-l10n-id="esin-input-placeholder"></textarea>
        <button id="esin-send" type="submit">
          <svg:svg class="ic-send" viewBox="0 0 16 16"><svg:path d="M8 13V3.5M4 7l4-4 4 4"/></svg:svg>
          <svg:svg class="ic-stop" viewBox="0 0 16 16"><svg:rect x="4.5" y="4.5" width="7" height="7" rx="1.5"/></svg:svg>
        </button>
      </form>
      <div id="esin-quota" role="status" hidden="true"></div>
    </aside>
  </div>


  <!-- First launch (welcome): full-window layer; the steps are in vento-welcome.js -->
  <div id="welcome" hidden="true" role="dialog" aria-modal="true" aria-labelledby="w-title-lang">
    <button id="w-skip" data-l10n-id="w-skip"></button>
    <div id="w-card">
      <div id="w-ebabil" aria-hidden="true"><img id="w-eb-img" src="chrome://vento/content/ebabil/still.webp" alt=""/></div>

      <section class="w-step" data-step="lang">
        <h1 class="w-h" id="w-title-lang">Hoş geldin · Welcome</h1>
        <p class="w-p">Dilini seç · Choose your language</p>
        <div class="w-choices">
          <button class="w-choice" data-lang="tr" aria-pressed="false">Türkçe</button>
          <button class="w-choice" data-lang="en-US" aria-pressed="false">English</button>
        </div>
      </section>

      <section class="w-step" data-step="hello" hidden="true">
        <h1 class="w-h" data-l10n-id="w-hello-title"></h1>
        <p class="w-p" data-l10n-id="w-hello-body"></p>
        <ul class="w-tips">
          <li data-l10n-id="w-tip-bar"><kbd></kbd></li>
          <li data-l10n-id="w-tip-find"><kbd></kbd></li>
          <li data-l10n-id="w-tip-tabs"><kbd></kbd><kbd></kbd></li>
          <li data-l10n-id="w-tip-esin"><kbd></kbd></li>
        </ul>
      </section>

      <section class="w-step" data-step="esin" hidden="true">
        <h1 class="w-h" data-l10n-id="w-esin-title"></h1>
        <p class="w-p" data-l10n-id="w-esin-body"></p>
        <div class="w-choices">
